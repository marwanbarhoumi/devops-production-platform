# Prometheus configuration for the Kubernetes deployment (kubernetes/monitoring), the counterpart of
# prometheus.yml (Docker Compose). Same job names and `service` label, so the alert rules and the
# "Platform overview" dashboard work unchanged in both runtimes. Targets come from Kubernetes service
# discovery (pods and EndpointSlices), never from pod IPs written here.
#
# Prometheus may only list pods in the two namespaces below (Roles in kubernetes/app/monitoring-access.yaml and
# kubernetes/monitoring/prometheus.yaml); there is no cluster-wide discovery.

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application pods that opt in with the annotations prometheus.io/scrape: "true" and prometheus.io/port.
  # One target per pod: with 2 replicas each service has 2 `up` series, told apart by the `pod` label.
  - job_name: platform-services
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [devops-platform]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: (.+);(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: service
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  # Kubernetes object state. honor_labels keeps the objects' own namespace/pod labels.
  - job_name: kube-state-metrics
    honor_labels: true
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpointslice_port_name]
        regex: kube-state-metrics;http-metrics
        action: keep

  # Node metrics, one node-exporter pod per node (DaemonSet).
  - job_name: node-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [monitoring]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: prometheus

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana
