<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DPP showcase - title</title>
<link rel="stylesheet" href="style.css">
<style>
  .content { position: absolute; left: 7vw; top: 50%; transform: translateY(-50%); width: 56vw; }
  h1 { font-size: 5.6vw; margin: 1.4vw 0 1.3vw; }
  .subtitle { font-size: 1.75vw; margin-bottom: 3vw; }
  .group-label { font-size: 0.95vw; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin: 1.6vw 0 0.8vw; }
  svg.net { position: absolute; right: 3vw; top: 50%; transform: translateY(-50%); width: 36vw; height: 36vw; }
</style>
</head>
<body>
<div class="stage">
  <div class="grid"></div>
  <div class="content">
    <div class="eyebrow">Hands-on DevOps portfolio project</div>
    <h1>DevOps Production Platform</h1>
    <div class="subtitle">Automated CI/CD &bull; DevSecOps &bull; Infrastructure Automation</div>
    <div class="group-label">Implemented and verified</div>
    <div class="chips">
      <span class="chip">TypeScript microservices</span><span class="chip">PostgreSQL</span><span class="chip">Docker</span>
      <span class="chip">Jenkins</span><span class="chip">SonarQube</span><span class="chip">Trivy</span>
      <span class="chip">CycloneDX SBOM</span><span class="chip">GHCR</span><span class="chip">Ansible</span>
    </div>
    <div class="group-label">Next on the roadmap</div>
    <div class="chips">
      <span class="chip next">Kubernetes</span><span class="chip next">Helm</span>
      <span class="chip next">Prometheus</span><span class="chip next">Grafana</span>
    </div>
  </div>
  <svg class="net" viewBox="0 0 400 400" aria-hidden="true">
    <g fill="none" stroke="#38bdf8" stroke-width="1.6" opacity="0.7">
      <path class="flow" d="M200 60 L320 140 L320 260 L200 340 L80 260 L80 140 Z"/>
      <path class="flow" d="M200 60 L200 200 M320 140 L200 200 M320 260 L200 200 M200 340 L200 200 M80 260 L200 200 M80 140 L200 200"/>
    </g>
    <g fill="#0b1426" stroke-width="2">
      <circle cx="200" cy="200" r="34" stroke="#34d399"/>
      <circle class="pulse" cx="200" cy="60" r="16" stroke="#38bdf8"/>
      <circle class="pulse" cx="320" cy="140" r="16" stroke="#38bdf8"/>
      <circle class="pulse" cx="320" cy="260" r="16" stroke="#38bdf8"/>
      <circle class="pulse" cx="200" cy="340" r="16" stroke="#38bdf8"/>
      <circle class="pulse" cx="80" cy="260" r="16" stroke="#38bdf8"/>
      <circle class="pulse" cx="80" cy="140" r="16" stroke="#38bdf8"/>
    </g>
    <path d="M186 200 l9 9 l19 -19" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>
</body>
</html>
