# devops-production-platform - local Jenkins CI stack (Phase 2)
#
# Independent of the application stack in ../docker-compose.yml (own project name, network and volumes).
#
#   cd jenkins
#   docker compose up -d --build controller dind     # first start; then follow README "First-time setup"
#   docker compose up -d agent                       # once secrets/agent-secret exists
#
# Only the Jenkins web UI is published, on 127.0.0.1. The agent connects over WebSocket on the
# internal network, so no inbound-agent TCP port (50000) is needed.

name: dpp-jenkins

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  controller:
    image: dpp-jenkins/controller:local
    build: ./controller
    restart: unless-stopped
    environment:
      # Public URL of this Jenkins (used in links and for webhooks). Change together with JENKINS_HTTP_PORT.
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8090/}
      JAVA_OPTS: "-Xmx1g"
    ports:
      # 8090 rather than Jenkins' usual 8080, which is often taken by other local tools.
      - "${JENKINS_BIND_ADDRESS:-127.0.0.1}:${JENKINS_HTTP_PORT:-8090}:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
    networks:
      - jenkins
    security_opt:
      - no-new-privileges:true
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M

  # Docker-in-Docker: a private Docker daemon for builds. Pipelines start their throwaway containers
  # (integration-test PostgreSQL) here, never on the host daemon, so CI cannot touch the application
  # stack, its volumes or any other container on this machine.
  # SECURITY: privileged mode gives this container root-level control of the Docker Desktop VM / Linux
  # host. Acceptable for a local portfolio setup; do not build untrusted pull requests with it.
  dind:
    image: docker:29.9.0-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs:/certs/client
      - docker-data:/var/lib/docker
    networks:
      jenkins:
        # The TLS server certificate generated by dind is valid for the name "docker".
        aliases:
          - docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  agent:
    image: dpp-jenkins/agent:local
    build: ./agent
    restart: unless-stopped
    init: true
    environment:
      JENKINS_URL: http://controller:8080/
      JENKINS_AGENT_NAME: ci-agent-1
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      # agent.jar reads the secret from the file when the value starts with "@".
      JENKINS_SECRET: "@/run/secrets/jenkins_agent_secret"
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - jenkins_agent_secret
    volumes:
      - docker-certs:/certs/client:ro
      # Workspace and npm cache survive agent restarts.
      - agent-home:/home/jenkins
    networks:
      - jenkins
    security_opt:
      - no-new-privileges:true
    depends_on:
      controller:
        condition: service_healthy
      dind:
        condition: service_healthy
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G

secrets:
  jenkins_agent_secret:
    # Created during first-time setup (README); git-ignored. Never commit it.
    file: ./secrets/agent-secret

networks:
  jenkins: {}

volumes:
  jenkins-home:
  agent-home:
  docker-certs:
  docker-data:
