# SonarQube analysis of the three services (Phase 3). Run by the Jenkins "SonarQube Analysis" stage;
# the server URL and token come from Jenkins, never from this file. Setup: security/README.md.
sonar.projectKey=devops-production-platform
sonar.projectName=devops-production-platform

sonar.sources=services/api-gateway/src,services/product-service/src,services/order-service/src
sonar.tests=services/api-gateway/test,services/product-service/test,services/order-service/test
sonar.sourceEncoding=UTF-8

# Coverage from scripts/ci/run-unit-tests.mjs and scripts/run-integration-tests.mjs (merged by SonarQube).
sonar.javascript.lcov.reportPaths=\
  reports/coverage/unit/api-gateway/lcov.info,\
  reports/coverage/unit/product-service/lcov.info,\
  reports/coverage/unit/order-service/lcov.info,\
  reports/coverage/integration/product-service/lcov.info,\
  reports/coverage/integration/order-service/lcov.info

# Process entry points are exercised by the smoke test against the running stack, not by unit tests.
sonar.coverage.exclusions=services/*/src/server.ts

# The scanner waits for the quality gate and fails the build when it is not passed.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
