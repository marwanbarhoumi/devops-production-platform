# devops-production-platform - Ansible controller (Phase 4)
#
# Independent of the application stack (../docker-compose.yml), Jenkins (../jenkins) and SonarQube
# (../security/sonarqube): own project name and network. Nothing here runs permanently.
#
#   .\ansible\ansible.ps1 <command>        # e.g. ansible-playbook -i inventory/dev.ini playbooks/site.yml --check
#   .\ansible\test\run-local-test.ps1      # disposable Ubuntu 24.04 target: full playbook + idempotency check

name: dpp-ansible

services:
  ansible: &controller
    image: dpp-ansible/controller:local
    build: .
    # The ansible/ directory: playbooks, roles, inventories, and the git-ignored .ssh/ (keys, known_hosts).
    volumes:
      - ./:/ansible
    read_only: true
    tmpfs:
      # Private keys are copied here by entrypoint.sh with mode 600; gone when the container exits.
      - /home/ansible/.ssh:uid=1000,gid=1000,mode=0700
      - /home/ansible/.ansible:uid=1000,gid=1000,mode=0700
      - /home/ansible/.cache:uid=1000,gid=1000,mode=0700
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ansible

  # --- Local test only (profile "test"); never used for real hosts ------------------------------------
  # A disposable Ubuntu 24.04 machine with systemd and sshd, prepared like a fresh server (automation user,
  # key-only SSH, passwordless sudo). Privileged because it runs systemd and Docker Engine inside; it
  # exists only during test/run-local-test.ps1 and is reachable only from this Compose network.
  test-target:
    profiles: ["test"]
    image: dpp-ansible/test-target:local
    build: ./test/target
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # Public key generated by the test run (test/run-local-test.ps1); read-only for the target.
      - test-keys:/etc/ssh/dpp-test-keys:ro
      # Docker Engine and containerd inside the target need a non-overlay filesystem for their data.
      - test-target-docker:/var/lib/docker
      - test-target-containerd:/var/lib/containerd
    tmpfs:
      - /run
      - /run/lock
    networks:
      - ansible
    labels:
      dpp.purpose: ansible-local-test

  # The controller plus the throwaway test key (read-only); runs test/verify.sh.
  test-runner:
    <<: *controller
    profiles: ["test"]
    volumes:
      - ./:/ansible
      - test-keys:/test-keys:ro

  # Writes a throwaway test key pair into the test-keys volume, owned by uid 1000: the controller's
  # ansible user (reads the private key) and the target's automation user (sshd StrictModes).
  test-keygen:
    profiles: ["test"]
    image: dpp-ansible/controller:local
    entrypoint: ["sh", "-euc"]
    command:
      - >-
        test -f /keys/automation || ssh-keygen -q -t ed25519 -N '' -C dpp-ansible-local-test -f /keys/automation;
        chown -R 1000:1000 /keys; chmod 755 /keys; chmod 600 /keys/automation; chmod 644 /keys/automation.pub
    user: "0:0"
    volumes:
      - test-keys:/keys
    network_mode: none

networks:
  ansible: {}

volumes:
  test-keys:
    labels:
      dpp.purpose: ansible-local-test
  test-target-docker:
    labels:
      dpp.purpose: ansible-local-test
  test-target-containerd:
    labels:
      dpp.purpose: ansible-local-test
