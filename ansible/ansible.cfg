# Ansible configuration for devops-production-platform (Phase 4).
# The controller container sets ANSIBLE_CONFIG to this file: Ansible ignores an ansible.cfg found in a
# world-writable working directory, which is how Windows bind mounts appear inside Linux containers.
[defaults]
# No default inventory on purpose: every command must name one with -i, so nothing runs against a host
# by accident.
roles_path = roles
interpreter_python = auto_silent
host_key_checking = True
retry_files_enabled = False
forks = 10
timeout = 20
nocows = True
callback_result_format = yaml
display_skipped_hosts = False

[privilege_escalation]
# Plays that change the system set "become: true" themselves; nothing else runs as root.
become = False
become_method = sudo

[ssh_connection]
# Known hosts live in the git-ignored ansible/.ssh/known_hosts (see README "SSH and host keys").
# StrictHostKeyChecking=yes: an unknown or changed host key stops the run instead of being trusted.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/ansible/.ssh/known_hosts -o IdentitiesOnly=yes -o PasswordAuthentication=no
control_path_dir = /tmp/ansible-ssh-cp
pipelining = True
