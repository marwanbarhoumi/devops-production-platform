---
# Baseline only (OS check, apt index, admin packages, automatic security updates).
#   .\ansible\ansible.ps1 ansible-playbook -i inventory/dev.ini playbooks/common.yml --check --diff
- name: Apply the common baseline
  hosts: managed
  become: true
  # Facts are gathered only after the safety checks, so a rejected host is never contacted.
  gather_facts: false
  pre_tasks:
    - name: Run safety checks
      ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: common
