---
# Docker Engine and the Compose plugin only (the role installs its own repository prerequisites).
#   .\ansible\ansible.ps1 ansible-playbook -i inventory/dev.ini playbooks/docker.yml --check --diff
- name: Install and configure Docker Engine
  hosts: managed
  become: true
  # Facts are gathered only after the safety checks, so a rejected host is never contacted.
  gather_facts: false
  pre_tasks:
    - name: Run safety checks
      ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Gather facts
      ansible.builtin.setup:
  roles:
    - role: docker_engine
