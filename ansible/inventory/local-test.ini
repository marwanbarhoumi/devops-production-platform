# Disposable local test target only (test/run-local-test.ps1). "test-target" resolves only inside the
# dpp-ansible Compose network, so this inventory cannot reach any other machine.
[local_test]
dpp-test-target ansible_host=test-target

[local_test:vars]
deployment_environment=test
ansible_user=automation
ansible_ssh_private_key_file=/home/ansible/.ssh/dpp-local-test

[managed:children]
local_test
